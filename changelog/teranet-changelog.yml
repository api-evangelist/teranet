summary: >-
  Teranet publishes a dated, chronological change and notice stream on the Teraview product site.
  It is a product changelog, not an API changelog — entries describe registry feature changes,
  statutory fee changes, sign-in changes and scheduled outages, each with an explicit effective
  date. Entries are numbered as Bulletins (Bulletin No. YYYY-NN) when they change registry
  behaviour that conveyancing software must follow, which makes the bulletin series the closest
  thing Teranet publishes to a breaking-change notice for its integrators.
