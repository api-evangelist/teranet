summary: >-
  Teranet publishes a genuine non-production training environment for Teraview, the electronic
  land registration client — a separate host from production with a published shared password, so
  a conveyancer can practise docket creation, property and map search, instrument creation, signing
  and registration without touching the live registry. This is a UI training sandbox for the
  Teraview application, NOT a developer sandbox: there is no test API endpoint, no sandbox API key,
  no test-vs-live key prefix scheme and no fixture or trigger tooling for Teranet Connect. A
  vendor integrating Teranet Connect obtains test access through its licence agreement and account
  manager, not from a public sandbox.
