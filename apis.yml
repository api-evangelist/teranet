name: Teranet
kind: company
description: >-
  Teranet Inc. is the private operator of Ontario's Electronic Land Registration System (ELRS) and the
  POLARIS land records database under a long-running concession with the Government of Ontario, and is
  the exclusive service provider for Manitoba's Land Titles System and Personal Property Registry. Founded
  in 1991, headquartered in Toronto and wholly owned by OMERS, Teranet sits at the base of the Canadian
  property value chain: it holds the authoritative title, parcel, writ and instrument record and resells
  it as commercial products — Teraview, OnLand, Teranet eXpress, GeoWarehouse, PurView, Teranet Xchange,
  DataConnect/ValueProtect AVM, TeraIntelligence — plus the Teranet-National Bank House Price Index. Its
  API posture is licensed access only. Teranet Connect is genuinely described by Teranet as an API (XML
  and web services over POLARIS and the Writs database), but it is licensed to legal-software vendors
  through an account manager, with no public documentation, no published base URL, no self-serve signup
  and no developer portal; Teranet's own support site states plainly that GeoWarehouse has no open API.
  No RESO certification was found — Teranet is a land registry, not an MLS — and the public record it
  stewards is sold back rather than published as open data.
