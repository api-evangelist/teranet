apis:
- aid: teranet:teranet-connect
  name: Teranet Connect
  description: >-
    Teranet Connect is described by Teranet as an application programming interface providing secure
    access to Ontario's POLARIS land registration database and the Writs database, using XML and web
    services interfaces with rules-based routing. It lets legal document creation and management software
    vendors embed property search (by name, address or PIN), writ search by debtor name, instrument image
    retrieval and map data into their own applications. Access is licensed commercially through a Teranet
    account manager; no public technical documentation, base URL, sandbox or self-serve signup is published.
  humanURL: https://www.teranet.ca/registry-solutions/province-of-ontario/teranet-connect/
