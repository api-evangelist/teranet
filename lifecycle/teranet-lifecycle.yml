summary: >-
  Teranet runs its operational-transparency surface on the Teraview product site rather than on a
  developer portal. There is a real, human-readable system-status page covering twelve named
  subsystems, a published hours-of-service schedule (the registry is deliberately not a 24/7
  system), and dated maintenance notices posted in advance. There is no versioning policy, no
  deprecation policy, no Sunset/Deprecation header support, and no published SLA or uptime target —
  consistent with a licensed, account-managed integration where these terms live in the licence
  agreement rather than in public documentation.
